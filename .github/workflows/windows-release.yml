name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: msbuild SnapAfghanistan.Native.csproj /t:Restore /p:RestoreIgnoreFailedSources=true

      - name: Build desktop application
        run: msbuild SnapAfghanistan.Native.csproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path . -Recurse -Filter SnapAfghanistan.exe |
            Where-Object { $_.FullName -match '\\bin\\.*Release' } |
            Select-Object -First 1
          if (-not $app) { throw 'SnapAfghanistan.exe was not produced.' }
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item -Path (Join-Path $app.DirectoryName '*') -Destination publish -Recurse -Force

      - name: Native and LAN smoke test
        shell: pwsh
        run: |
          $selfTestRoot = Join-Path $env:RUNNER_TEMP 'SnapAfghanistan-SelfTestData'
          if (Test-Path $selfTestRoot) { Remove-Item $selfTestRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $selfTestRoot | Out-Null
          $env:SNAP_DATA_ROOT = $selfTestRoot
          $process = Start-Process -FilePath .\publish\SnapAfghanistan.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)." }
          $db = Join-Path $selfTestRoot 'Data\snap.db'
          if (-not (Test-Path $db)) { throw 'Self-test database was not created.' }

      - name: Install Inno Setup compiler
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        run: iscc Installer.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapAfghanistan-Windows-Setup-1.4.0
          path: installer-output/SnapAfghanistan-Setup-1.4.0.exe
          if-no-files-found: error

      - name: Publish preview release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-preview
          name: Snap Afghanistan 1.4.0 Preview
          prerelease: true
          make_latest: false
          files: installer-output/SnapAfghanistan-Setup-1.4.0.exe
          body: |
            Snap Afghanistan 1.4 introduces an offline LAN server/client architecture for office multi-user use.
            It includes independent users, roles and permissions, central audit identity, optimistic concurrency protection, central attachments and backup ownership, and encrypted LAN transport.
            The native self-test also validates authenticated loopback LAN communication before the installer is built.
